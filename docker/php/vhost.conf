ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    ServerName localhost
    ServerAlias *
    DocumentRoot /var/www/sentra/public

    <Directory /var/www/sentra/public>
        AllowOverride All
        Require all granted
        Options -Indexes
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
